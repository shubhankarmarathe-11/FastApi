[project]
name = "python-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shubhankar Marathe", email = "shubhankarsourabhmarathe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "bullmq>=3.6.2",
    "emails>=1.1.2",
    "fastapi[standard]>=0.141.1",
    "phonenumbers>=9.0.37",
    "pyjwt>=2.13.0",
    "pymysql>=1.2.0",
    "redis>=8.1.0",
    "sqlmodel>=0.0.39",
]

[project.scripts]
python-project = "python_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
