[project]
name = "gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shubhankar Marathe", email = "shubhankarsourabhmarathe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.38",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "pymysql>=1.2.0",
    "sqlmodel>=0.0.39",
    "authlib>=1.9.1",
    "google-auth>=2.62.0",
    "requests>=2.34.2",
]

[project.scripts]
gateway = "gateway:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
